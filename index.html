<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f5f0"><title>现在做什么</title>
<link rel="stylesheet" href="style.css?v=20261022-instant-start">
</head>
<body>
<header>
<a class="brand" href="#home" aria-label="现在做什么，返回开始">现在做什么</a>
<nav aria-label="主导航"><button type="button" data-page="home">开始</button><button type="button" data-page="tasks">我的活动</button><button type="button" data-page="today">今天</button></nav>
<button type="button" id="dataMenuToggle" class="settings-toggle" data-page="settings" aria-label="设置" aria-controls="settings" title="设置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m9 3-.6 2.2-2 .9-2.1-.6-2 3.5 1.6 1.6v2.3L2.3 14l2 3.5 2.1-.6 2 .9L9 20h4l.6-2.2 2-.9 2.1.6 2-3.5-1.6-1.6v-2.3L19.7 9l-2-3.5-2.1.6-2-.9L13 3Z"/><circle cx="11" cy="11.5" r="3"/></svg></button>
</header>
<main>
<section id="home" class="page">
<div id="onboarding" class="onboarding hide"><div class="welcome-card"><h1>有什么事，你一直想做？</h1><form id="quickAddForm"><label class="sr-only" for="quickName">活动名称</label><input id="quickName" placeholder="例如：读书、练字、复习单词" maxlength="300" required autocomplete="off"><button type="submit" id="addFirstTask" class="primary">添加活动</button></form><button type="button" id="quickOptions" class="quiet-link welcome-defaults">每次 10 分钟 · 安静 · 无需电脑 <span aria-hidden="true">›</span></button></div><button type="button" id="restoreWelcome" class="quiet-link restore-link">已有数据？恢复备份</button></div>
<div id="homeWorkspace" class="home-workspace">
<div class="hero"><h1>现在，做一件想做的事。</h1></div>
<div class="home-controls">
<details id="timePicker" class="condition-picker"><summary><span id="timeSummary">15 分钟</span><span class="chevron" aria-hidden="true"></span></summary><div class="condition-panel"><h2 id="timeLabel">可用时间</h2><div id="times" class="choices" role="group" aria-labelledby="timeLabel"><button type="button" data-v="5" aria-pressed="false">5 分钟</button><button type="button" data-v="10" aria-pressed="false">10 分钟</button><button type="button" data-v="15" aria-pressed="false">15 分钟</button><button type="button" data-v="30" aria-pressed="false">30 分钟</button><button type="button" data-v="60" aria-pressed="false">60 分钟</button><button type="button" data-v="custom" aria-pressed="false" aria-controls="customTimeField">自定义</button></div><div id="customTimeField" class="custom-time hide"><label for="customMinutes" class="sr-only">自定义可用时间（分钟）</label><div class="custom-minutes-control"><input id="customMinutes" type="text" inputmode="numeric" autocomplete="off" aria-describedby="customTimeError" placeholder="例如 25"><span aria-hidden="true">分钟</span></div><p id="customTimeError" role="status"></p></div></div></details>
<details id="environmentPicker" class="condition-picker"><summary><span id="environmentSummary">安静 · 无电脑</span><span class="chevron" aria-hidden="true"></span></summary><div class="condition-panel"><h2 id="envLabel">当前环境</h2><div id="envs" class="choices" role="group" aria-labelledby="envLabel"><button type="button" data-v="quiet" aria-pressed="false">安静</button><button type="button" data-v="noisy" aria-pressed="false">有人 / 嘈杂</button><button type="button" data-v="class" aria-pressed="false">必须听课</button></div><label id="computerReadyLabel" class="home-computer"><input type="checkbox" id="computerReady"> 现在方便使用电脑</label></div></details>
</div>
<div id="rec" class="rec hide" role="region" aria-label="推荐活动"></div><div class="home-entries"><button type="button" id="random" class="quiet-link">换一件</button><button type="button" id="browse" class="quiet-link">自己选择活动</button></div>
</div></section>
<section id="tasks" class="page collection-page">
<div class="heading"><h1>我的活动</h1><button type="button" id="newTask" class="primary">＋ 添加</button></div>
<div class="library-tools"><div id="categoryTabs" class="category-tabs hide" role="group" aria-label="活动分类"><button type="button" data-category="" aria-pressed="true">全部</button><button type="button" data-category="study" aria-pressed="false">学习</button><button type="button" data-category="work" aria-pressed="false">工作</button><button type="button" data-category="life" aria-pressed="false">生活</button><button type="button" data-category="exercise" aria-pressed="false">运动</button><button type="button" data-category="other" aria-pressed="false">其他</button><button type="button" data-category="uncategorized" class="hide" aria-pressed="false">未分类</button></div><label class="search-field"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><span class="sr-only">搜索活动</span><input id="taskSearch" type="search" placeholder="搜索活动…" autocomplete="off"></label><details id="libraryFilters" class="filter-menu"><summary class="secondary">筛选<span id="filterCount"></span></summary><div class="filters"><label>预计时长<select id="ft"><option value="">全部时间</option><option value="5">≤ 5 分钟</option><option value="10">≤ 10 分钟</option><option value="15">≤ 15 分钟</option><option value="30">≤ 30 分钟</option><option value="60">60 分钟以上</option></select></label><label>适用环境<select id="fe"><option value="">全部环境</option><option value="quiet">安静</option><option value="noisy">有人/嘈杂</option><option value="class">必须听课</option></select></label><label class="checkbox-label"><input type="checkbox" id="fc"> 需要电脑</label><button type="button" id="clearFilters" class="quiet-link">清除筛选</button></div></details></div>
<div id="taskList" class="activity-list"></div></section>
<section id="today" class="page collection-page"><div class="today-heading"><h1>今天</h1><span id="date"></span></div><div id="todayBox"></div></section>
<section id="settings" class="page collection-page settings-page" aria-labelledby="settingsTitle">
<div class="heading"><h1 id="settingsTitle">设置</h1><button type="button" id="closeSettings" class="quiet-link">返回</button></div>
<div id="dataPanel" class="settings-surface" role="group" aria-label="外观与数据管理">
<div class="settings-row"><span>外观</span><div class="theme-options" role="group" aria-label="外观"><button type="button" id="lightTheme" aria-pressed="true">浅色</button><button type="button" id="theme" aria-pressed="false">深色</button></div></div>
<div class="settings-row"><div><span>备份数据</span><p id="backupDescription">下载一份备份文件</p></div><button type="button" class="secondary" id="export" aria-describedby="backupDescription">导出</button></div>
<div class="settings-row"><div><span>恢复备份</span><p id="restoreDescription">从备份文件恢复，替换当前内容</p></div><button type="button" class="secondary" id="import" aria-describedby="restoreDescription">导入</button></div>
</div><p class="settings-note">数据仅保存在当前浏览器，不会自动同步。</p>
</section>
<div id="activityMenu" class="activity-menu hide" role="menu" aria-label="活动操作"><button type="button" id="activityMenuEdit" role="menuitem" tabindex="-1">编辑</button><button type="button" id="activityMenuDelete" role="menuitem" tabindex="-1">删除</button></div>
</main>
<div id="confirmLayer" class="confirm-layer hide" role="dialog" aria-modal="true" aria-labelledby="confirmTitle"><div class="confirm-card"><p class="confirm-kicker" id="confirmKicker">请确认</p><h2 id="confirmTitle"></h2><p id="confirmText"></p><div class="confirm-task"><strong id="confirmTaskName"></strong><span id="confirmTaskDesc"></span></div><div class="confirm-actions"><button type="button" class="outline" id="confirmCancel">取消</button><button type="button" class="danger hide" id="confirmAbandon">放弃本次</button><button type="button" class="primary" id="confirmAccept">确认</button></div></div></div>
<aside id="floatingTimer" class="floating-timer hide" aria-label="悬浮计时器"><div id="floatingHandle" class="floating-handle" role="button" tabindex="0" aria-label="返回完整计时页面，可拖动悬浮计时器"><small id="floatingStatus"></small><div id="floatingClock">00:00</div><div id="floatingName"></div></div><div class="floating-actions"><button type="button" id="floatingPause" class="primary">暂停</button><button type="button" id="floatingEnd" class="secondary">结束</button></div></aside>
<section id="timer" class="timer-screen hide" aria-label="活动计时"><div class="timer-card"><p class="timer-kicker" id="timerStatus" role="status">正在专注</p><h1 id="timerName"></h1><details id="timerDescription" class="timer-description"><summary>活动说明</summary><p id="timerDesc" class="timer-desc"></p></details><div id="timerClock" role="timer" aria-live="off">00:00</div><div class="timer-track" aria-hidden="true"><i id="timerProgress"></i></div><p id="timerMeta" class="timer-meta"></p><div id="timerActions" class="timer-actions"></div></div></section>
<div id="modal" class="modal hide" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="dialog activity-dialog">
    <div class="activity-dialog-header"><h2 id="modalTitle">添加活动</h2><button type="button" class="x icon-button" id="close" aria-label="关闭活动编辑">×</button></div>
    <form id="form">
      <div class="activity-form-body">
        <input type="hidden" id="tid"><label for="name" class="sr-only">活动名称</label><input id="name" placeholder="想做什么？例如：读书" required autocomplete="off">
        <div class="activity-conditions">
          <label class="duration-field"><span class="sr-only">每次预计时长</span><input id="mins" type="number" min="1" max="1440" value="10" required><span>分钟</span></label>
          <label class="environment-field"><span class="sr-only">适用环境</span><select id="environment"><option value="quiet">安静</option><option value="noisy">有人/嘈杂</option><option value="class">必须听课</option></select></label>
          <label class="checkbox-label computer-label"><input type="checkbox" id="computer"> 需要电脑</label>
        </div>
        <div class="activity-extras">
          <details id="activityOptions" class="description-options"><summary id="descriptionToggle">＋ 添加说明</summary><div class="description-field"><label for="desc" class="sr-only">活动说明</label><textarea id="desc" rows="1" placeholder="添加一句说明（可选）"></textarea></div></details>
          <label class="category-choice"><span class="sr-only">活动分类</span><select id="activityCategory" title="活动分类（可选）"><option value="">未分类</option><option value="study">学习</option><option value="work">工作</option><option value="life">生活</option><option value="exercise">运动</option><option value="other">其他</option></select></label>
        </div>
      </div>
      <div class="activity-dialog-footer"><button type="submit" id="saveActivity" class="primary save-activity">添加</button></div>
    </form>
  </div>
</div>
<input type="file" id="file" hidden accept="application/json"><script src="app.js?v=20261022-instant-start"></script>
</body>
</html>
