<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f766e"><title>现在做什么</title><link rel="stylesheet" href="style.css?v=20261021-mint-home"></head><body>
<header><a class="brand" href="#home" aria-label="现在做什么"><svg class="brand-mark" aria-hidden="true" viewBox="0 0 24 24"><path d="M19 4c-8-2-15 2-14 8 1 5 8 7 12 2 2-3 2-6 2-10ZM7 18l8-10m-5 7-2-4"/></svg><span class="brand-name">现在做什么</span></a><nav><button data-page="home">开始</button><button data-page="today">今天</button><button data-page="tasks">任务库</button></nav><button id="theme">◐</button><details id="dataMenu" class="data-menu"><summary id="dataMenuToggle" aria-label="数据管理" title="数据管理"><span aria-hidden="true">⚙</span><span class="data-menu-label">数据管理</span></summary><div id="dataPanel" class="data-panel" role="group" aria-label="备份与恢复"><div class="backup-action"><button type="button" class="secondary" id="export" aria-describedby="backupDescription">备份我的数据</button><p id="backupDescription">下载 JSON 备份文件，保存任务、目标和学习记录。</p></div><div class="backup-action"><button type="button" class="secondary" id="import" aria-describedby="restoreDescription">从备份恢复</button><p id="restoreDescription">选择已有 JSON 备份，确认后恢复数据，可能替换当前内容。</p></div></div></details></header>
<main><section id="home" class="page">
<div class="hero"><h1>现在做什么？</h1><p>选好时间和环境，开始一件想做的事。</p></div>
<div class="panel home-workspace">
<div class="home-controls">
<h2 id="timeLabel"><svg class="home-icon" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>我有多少时间？</h2>
<div id="times" class="choices" role="group" aria-labelledby="timeLabel"><button type="button" data-v="5" aria-pressed="false">5 分钟</button><button type="button" data-v="10" aria-pressed="false">10 分钟</button><button type="button" data-v="15" aria-pressed="false">15 分钟</button><button type="button" data-v="30" aria-pressed="false">30 分钟</button><button type="button" data-v="60" aria-pressed="false">60 分钟以上</button><button type="button" data-v="custom" aria-pressed="false" aria-controls="customTimeField">自定义</button></div>
<div id="customTimeField" class="custom-time hide"><label for="customMinutes">可用时长 <input id="customMinutes" type="text" inputmode="numeric" autocomplete="off" aria-describedby="customTimeError" placeholder="如 25"> 分钟</label><p id="customTimeError" role="status"></p></div>
<h2 id="envLabel"><svg class="home-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="8" cy="6" r="2"/><circle cx="16" cy="12" r="2"/><circle cx="9" cy="18" r="2"/></svg>当前环境</h2>
<div class="home-environment"><div id="envs" class="choices" role="group" aria-labelledby="envLabel"><button type="button" data-v="quiet" aria-pressed="false">🟢 安静</button><button type="button" data-v="noisy" aria-pressed="false">🟡 有人 / 嘈杂</button><button type="button" data-v="class" aria-pressed="false">🔴 必须听课</button></div><label id="computerReadyLabel" class="home-computer"><input type="checkbox" id="computerReady"> 我现在方便使用电脑</label></div>
<div class="home-entries"><button type="button" id="random" class="primary" disabled><svg class="home-icon" aria-hidden="true" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8 8h.01M16 8h.01M12 12h.01M8 16h.01M16 16h.01" stroke-width="3"/></svg>随机推荐<svg class="home-icon entry-arrow" aria-hidden="true" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button><button type="button" id="browse" class="secondary"><svg class="home-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>自己选择任务<svg class="home-icon entry-arrow" aria-hidden="true" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button></div>
<p id="selectionHint" class="hint" role="status">先选择可用时间和环境，也可以直接自己选择任务。</p>
</div><div id="rec" class="rec hide" role="region" aria-label="推荐任务"></div>
</div></section>
<section id="today" class="page"><h1>今天 · <span id="date"></span></h1><div id="todayBox"></div></section><section id="tasks" class="page"><div class="heading"><h1>任务库</h1><button id="newTask" class="primary">＋ 添加任务</button></div><div class="filters"><select id="ft"><option value="">全部时间</option><option value="5">≤ 5 分钟</option><option value="10">≤ 10 分钟</option><option value="15">≤ 15 分钟</option><option value="30">≤ 30 分钟</option><option value="60">60 分钟以上</option></select><select id="fe"><option value="">全部环境</option><option value="quiet">安静</option><option value="noisy">有人/嘈杂</option><option value="class">必须听课</option></select><label><input type="checkbox" id="fc"> 需要电脑</label></div><div id="taskList" class="grid"></div></section></main>
<div id="confirmLayer" class="confirm-layer hide" role="dialog" aria-modal="true"><div class="confirm-card"><p class="confirm-kicker" id="confirmKicker">请确认</p><h2 id="confirmTitle"></h2><p id="confirmText"></p><div class="confirm-task"><strong id="confirmTaskName"></strong><span id="confirmTaskDesc"></span></div><div class="confirm-actions"><button class="outline" id="confirmCancel">继续计时</button><button type="button" class="danger hide" id="confirmAbandon">放弃任务</button><button class="primary" id="confirmAccept">确认</button></div></div></div><aside id="floatingTimer" class="floating-timer hide" aria-label="悬浮计时器"><div id="floatingHandle" class="floating-handle" role="button" tabindex="0" aria-label="返回完整计时页面，可拖动悬浮计时器"><small id="floatingStatus"></small><div id="floatingClock">00:00</div><div id="floatingName"></div></div><div class="floating-actions"><button type="button" id="floatingPause" class="primary">暂停</button><button type="button" id="floatingEnd" class="secondary">结束</button></div></aside><section id="timer" class="timer-screen hide" aria-live="polite"><div class="timer-card"><p class="timer-kicker" id="timerStatus">正在专注</p><h1 id="timerName"></h1><p id="timerDesc" class="timer-desc"></p><div id="timerClock">00:00</div><div class="timer-track"><i id="timerProgress"></i></div><p id="timerMeta" class="timer-meta"></p><div id="timerActions" class="timer-actions"></div></div></section><div id="modal" class="modal hide"><div class="dialog"><button class="x" id="close">×</button><h2 id="modalTitle">添加任务</h2><form id="form"><input type="hidden" id="tid"><label>任务名称<input id="name" placeholder="例如：读书、练字、复习单词" required></label><div class="row"><label>预计分钟<input id="mins" type="number" min="1" value="10" required></label><label>适用环境<select id="environment"><option value="quiet">安静</option><option value="noisy">有人/嘈杂</option><option value="class">必须听课</option></select></label></div><label><input type="checkbox" id="computer"> 需要电脑</label><label>任务描述<textarea id="desc" rows="3"></textarea></label><button class="primary">保存任务</button></form></div></div><footer>把零碎时间，还给自己。</footer><input type="file" id="file" hidden accept="application/json"><script src="app.js?v=20261021-quick-start"></script></body></html>
