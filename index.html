<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f5f0"><title>现在做什么</title>
<link rel="stylesheet" href="style.css?v=20261025-today-simple">
</head>
<body>
<header>
<a class="brand" href="#home" aria-label="现在做什么，返回开始" data-i18n-aria-label="现在做什么，返回开始"><span data-i18n="现在做什么">现在做什么</span></a>
<nav aria-label="主导航" data-i18n-aria-label="主导航"><button type="button" data-page="home"><span data-i18n="开始">开始</span></button><button type="button" data-page="tasks"><span data-i18n="我的活动">我的活动</span></button><button type="button" data-page="today"><span data-i18n="今天">今天</span></button></nav>
<button type="button" id="dataMenuToggle" class="settings-toggle" data-page="settings" aria-label="设置" data-i18n-aria-label="设置" aria-controls="settings" title="设置" data-i18n-title="设置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m9 3-.6 2.2-2 .9-2.1-.6-2 3.5 1.6 1.6v2.3L2.3 14l2 3.5 2.1-.6 2 .9L9 20h4l.6-2.2 2-.9 2.1.6 2-3.5-1.6-1.6v-2.3L19.7 9l-2-3.5-2.1.6-2-.9L13 3Z"/><circle cx="11" cy="11.5" r="3"/></svg></button>
</header>
<main>
<section id="home" class="page">
<div id="onboarding" class="onboarding hide"><div class="welcome-card"><h1><span data-i18n="有什么事，你一直想做？">有什么事，你一直想做？</span></h1><form id="quickAddForm"><label class="sr-only" for="quickName"><span data-i18n="活动名称">活动名称</span></label><input id="quickName" placeholder="例如：读书、练字、复习单词" data-i18n-placeholder="例如：读书、练字、复习单词" maxlength="300" required autocomplete="off"><button type="submit" id="addFirstTask" class="primary"><span data-i18n="添加活动">添加活动</span></button></form></div></div>
<div id="homeWorkspace" class="home-workspace">
<div class="home-controls">
<details id="timePicker" class="condition-picker"><summary><span id="timeSummary">15 分钟</span><span class="chevron" aria-hidden="true"></span></summary><div class="condition-panel"><h2 id="timeLabel"><span data-i18n="可用时间">可用时间</span></h2><div id="times" class="choices" role="group" aria-labelledby="timeLabel"><button type="button" data-v="5" aria-pressed="false">5 分钟</button><button type="button" data-v="10" aria-pressed="false">10 分钟</button><button type="button" data-v="15" aria-pressed="false">15 分钟</button><button type="button" data-v="30" aria-pressed="false">30 分钟</button><button type="button" data-v="60" aria-pressed="false">60 分钟</button><button type="button" data-v="custom" aria-pressed="false" aria-controls="customTimeField"><span data-i18n="自定义">自定义</span></button></div><div id="customTimeField" class="custom-time hide"><label for="customMinutes" class="sr-only"><span data-i18n="自定义可用时间（分钟）">自定义可用时间（分钟）</span></label><div class="custom-minutes-control"><input id="customMinutes" type="text" inputmode="numeric" autocomplete="off" aria-describedby="customTimeError" placeholder="例如 25" data-i18n-placeholder="例如 25"><span aria-hidden="true"><span data-i18n="分钟">分钟</span></span></div><p id="customTimeError" role="status"></p></div></div></details>
<details id="conditionsPicker" class="condition-picker"><summary><span id="conditionsSummary"><span data-i18n="当前条件">当前条件</span></span><span class="chevron" aria-hidden="true"></span></summary><div class="condition-panel current-conditions"><h2><span data-i18n="当前条件">当前条件</span></h2><label class="condition-toggle"><span><span data-i18n="方便使用电脑">方便使用电脑</span></span><input type="checkbox" id="computerReady" role="switch"></label><label class="condition-toggle"><span><span data-i18n="方便听音频">方便听音频</span></span><input type="checkbox" id="audioReady" role="switch"></label><label class="condition-toggle"><span><span data-i18n="方便出声">方便出声</span></span><input type="checkbox" id="speechReady" role="switch"></label><label class="condition-interruption"><input type="checkbox" id="interruptionsLikely"><span><span data-i18n="可能随时被打断">可能随时被打断</span></span></label></div></details>
</div>
<div id="rec" class="rec hide" role="region" aria-label="推荐活动" data-i18n-aria-label="推荐活动"></div><div class="home-entries"><button type="button" id="random" class="quiet-link"><span data-i18n="换一件">换一件</span></button><button type="button" id="browse" class="quiet-link"><span data-i18n="自己选择活动">自己选择活动</span></button></div>
</div></section>
<section id="tasks" class="page collection-page">
<div class="heading"><h1><span data-i18n="我的活动">我的活动</span></h1><div class="heading-actions"><button type="button" id="toggleActivitySearch" class="secondary library-search-toggle" aria-label="搜索活动" data-i18n-aria-label="搜索活动" aria-expanded="false" aria-controls="librarySearch" title="搜索活动" data-i18n-title="搜索活动"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg></button><button type="button" id="newTask" class="primary"><span data-i18n="＋ 添加">＋ 添加</span></button></div></div>
<div id="librarySearch" class="library-search hide"><label class="search-field"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><span class="sr-only"><span data-i18n="搜索活动">搜索活动</span></span><input id="taskSearch" type="search" placeholder="搜索活动…" data-i18n-placeholder="搜索活动…" autocomplete="off"></label><button type="button" id="closeActivitySearch" class="icon-button" aria-label="关闭搜索并显示全部活动" data-i18n-aria-label="关闭搜索并显示全部活动" title="关闭搜索" data-i18n-title="关闭搜索">×</button></div>
<div id="taskList" class="activity-list"></div></section>
<section id="today" class="page collection-page"><div class="today-heading"><h1><span data-i18n="今天">今天</span></h1><span id="date"></span></div><div id="todayBox"></div></section>
<section id="settings" class="page collection-page settings-page" aria-labelledby="settingsTitle">
<div class="heading"><h1 id="settingsTitle"><span data-i18n="设置">设置</span></h1><button type="button" id="closeSettings" class="quiet-link"><span data-i18n="返回">返回</span></button></div>
<div id="dataPanel" class="settings-surface" role="group" aria-label="外观与数据管理" data-i18n-aria-label="外观与数据管理">
<div class="settings-row language-row"><span><span data-i18n="语言">语言</span></span><div id="languageOptions" class="language-options" role="group" aria-label="语言" data-i18n-aria-label="语言"><button type="button" data-language="zh-CN" lang="zh-CN" aria-pressed="false">简体中文</button><button type="button" data-language="en" lang="en" aria-pressed="false">English</button><button type="button" data-language="ja" lang="ja" aria-pressed="false">日本語</button></div></div>
<div class="settings-row"><span><span data-i18n="外观">外观</span></span><div class="theme-options" role="group" aria-label="外观" data-i18n-aria-label="外观"><button type="button" id="lightTheme" aria-pressed="true"><span data-i18n="浅色">浅色</span></button><button type="button" id="theme" aria-pressed="false"><span data-i18n="深色">深色</span></button></div></div>
<div class="settings-row"><div><span><span data-i18n="备份数据">备份数据</span></span><p id="backupDescription"><span data-i18n="下载备份文件">下载备份文件</span></p></div><button type="button" class="secondary" id="export" aria-describedby="backupDescription"><span data-i18n="导出">导出</span></button></div>
<div class="settings-row"><div><span><span data-i18n="恢复备份">恢复备份</span></span><p id="restoreDescription"><span data-i18n="恢复后替换当前内容">恢复后替换当前内容</span></p></div><button type="button" class="secondary" id="import" aria-describedby="restoreDescription"><span data-i18n="导入">导入</span></button></div>
</div><p class="settings-note"><span data-i18n="数据仅保存在当前浏览器，不会自动同步。">数据仅保存在当前浏览器，不会自动同步。</span></p>
</section>
<div id="activityMenu" class="activity-menu hide" role="menu" aria-label="活动操作" data-i18n-aria-label="活动操作"><button type="button" id="activityMenuEdit" role="menuitem" tabindex="-1"><span data-i18n="编辑">编辑</span></button><button type="button" id="activityMenuDelete" role="menuitem" tabindex="-1"><span data-i18n="删除">删除</span></button></div>
</main>
<div id="confirmLayer" class="confirm-layer hide" role="dialog" aria-modal="true" aria-labelledby="confirmTitle"><div class="confirm-card"><p class="confirm-kicker" id="confirmKicker"><span data-i18n="请确认">请确认</span></p><h2 id="confirmTitle"></h2><p id="confirmText"></p><div class="confirm-task"><strong id="confirmTaskName"></strong><span id="confirmTaskDesc"></span></div><div class="confirm-actions"><button type="button" class="outline" id="confirmCancel"><span data-i18n="取消">取消</span></button><button type="button" class="danger hide" id="confirmAbandon"><span data-i18n="放弃本次">放弃本次</span></button><button type="button" class="primary" id="confirmAccept"><span data-i18n="确认">确认</span></button></div></div></div>
<button type="button" id="floatingTimer" class="floating-timer hide" aria-label="返回开始页的当前计时" data-i18n-aria-label="返回开始页的当前计时" title="返回当前计时" data-i18n-title="返回当前计时"><span id="floatingPaused" class="floating-paused hide" aria-hidden="true">Ⅱ</span><span id="floatingClock" aria-hidden="true">00:00</span></button>
<section id="timer" class="timer-screen hide" aria-label="活动计时" data-i18n-aria-label="活动计时"><div class="timer-card"><p class="timer-kicker" id="timerStatus" role="status"><span data-i18n="正在专注">正在专注</span></p><h1 id="timerName"></h1><details id="timerDescription" class="timer-description"><summary><span data-i18n="活动说明">活动说明</span></summary><p id="timerDesc" class="timer-desc"></p></details><div id="timerClock" role="timer" aria-live="off">00:00</div><div class="timer-track" aria-hidden="true"><i id="timerProgress"></i></div><p id="timerMeta" class="timer-meta"></p><div id="timerActions" class="timer-actions"></div></div></section>
<div id="modal" class="modal hide" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="dialog activity-dialog">
    <div class="activity-dialog-header"><h2 id="modalTitle"><span data-i18n="添加活动">添加活动</span></h2><button type="button" class="x icon-button" id="close" aria-label="关闭活动编辑" data-i18n-aria-label="关闭活动编辑">×</button></div>
    <form id="form">
      <div class="activity-form-body">
        <input type="hidden" id="tid"><label for="name" class="sr-only"><span data-i18n="活动名称">活动名称</span></label><input id="name" placeholder="想做什么？例如：读书" data-i18n-placeholder="想做什么？例如：读书" required autocomplete="off">
        <details id="requirementsOptions" class="requirements-options"><summary><span data-i18n="需要的条件（可选）">需要的条件（可选）</span></summary><div class="activity-requirements"><label class="checkbox-label"><input type="checkbox" id="computer"> <span data-i18n="必须用电脑">必须用电脑</span></label><label class="checkbox-label"><input type="checkbox" id="requiresAudio"> <span data-i18n="必须听音频">必须听音频</span></label><label class="checkbox-label"><input type="checkbox" id="requiresSpeech"> <span data-i18n="需要出声">需要出声</span></label><label class="checkbox-label"><input type="checkbox" id="requiresUninterrupted"> <span data-i18n="不便中断">不便中断</span></label></div></details>
        <div class="activity-extras">
          <details id="activityOptions" class="description-options"><summary id="descriptionToggle"><span data-i18n="＋ 添加说明">＋ 添加说明</span></summary><div class="description-field"><label for="desc" class="sr-only"><span data-i18n="活动说明">活动说明</span></label><textarea id="desc" rows="1" placeholder="添加一句说明（可选）" data-i18n-placeholder="添加一句说明（可选）"></textarea></div></details>
        </div>
      </div>
      <div class="activity-dialog-footer"><button type="submit" id="saveActivity" class="primary save-activity"><span data-i18n="添加">添加</span></button></div>
    </form>
  </div>
</div>
<input type="file" id="file" hidden accept="application/json"><script src="i18n.js?v=20261025-today-simple"></script><script src="app.js?v=20261025-today-simple"></script>
</body>
</html>
