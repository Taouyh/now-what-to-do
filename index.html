<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f766e"><title>现在做什么</title><link rel="stylesheet" href="style.css"></head><body>
<header><a class="brand" href="#home">⌁ 现在做什么</a><nav><button data-page="home">开始</button><button data-page="today">今天</button><button data-page="tasks">任务库</button><button data-page="goals">目标</button></nav><button id="theme">◐</button></header>
<main><section id="home" class="page"><div class="hero"><small>碎片时间任务助手</small><h1>现在做什么？</h1><p>不需要想，选个时间，马上开始。</p></div><div class="panel"><h2>我现在有多少时间？</h2><div id="times" class="choices"><button data-v="5">5 分钟</button><button data-v="10" class="on">10 分钟</button><button data-v="15">15 分钟</button><button data-v="30">30 分钟</button><button data-v="60">60 分钟以上</button></div><h2>我现在是什么环境？</h2><div id="envs" class="choices"><button data-v="quiet">🟢 安静</button><button data-v="noisy" class="on">🟡 有人 / 嘈杂</button><button data-v="class">🔴 必须听课</button></div><button id="random" class="primary big">🎲 随机给我一个任务</button><p class="hint">只需选择两项，剩下的交给我。</p></div><div id="rec" class="panel rec hide"></div><button id="browse" class="link">或者自己选择任务 →</button></section>
<section id="today" class="page"><h1>今天 · <span id="date"></span></h1><div id="todayBox"></div></section><section id="tasks" class="page"><div class="heading"><h1>任务库</h1><button id="newTask" class="primary">＋ 添加任务</button></div><div class="filters"><select id="fg"><option value="">全部目标</option></select><select id="ft"><option value="">全部时间</option><option value="5">≤ 5 分钟</option><option value="10">≤ 10 分钟</option><option value="15">≤ 15 分钟</option><option value="30">≤ 30 分钟</option><option value="60">60 分钟以上</option></select><select id="fe"><option value="">全部环境</option><option value="quiet">安静</option><option value="noisy">有人/嘈杂</option><option value="class">必须听课</option></select><label><input type="checkbox" id="fc"> 需要电脑</label><label><input type="checkbox" id="fd"> 已完成</label></div><div id="taskList" class="grid"></div></section><section id="goals" class="page"><div class="heading"><h1>我的目标</h1><button id="newGoal" class="primary">＋ 新增目标</button></div><div id="goalList" class="grid"></div></section></main>
<section id="timer" class="timer-screen hide" aria-live="polite"><div class="timer-card"><p class="timer-kicker" id="timerStatus">正在专注</p><h1 id="timerName"></h1><p id="timerDesc" class="timer-desc"></p><div id="timerClock">00:00</div><div class="timer-track"><i id="timerProgress"></i></div><p id="timerMeta" class="timer-meta"></p><div id="timerActions" class="timer-actions"></div></div></section><div id="modal" class="modal hide"><div class="dialog"><button class="x" id="close">×</button><h2 id="modalTitle">添加任务</h2><form id="form"><input type="hidden" id="tid"><label>任务名称<input id="name" required></label><label>所属目标<select id="goal"></select></label><div class="row"><label>预计分钟<input id="mins" type="number" min="1" value="10" required></label><label>适用环境<select id="environment"><option value="quiet">安静</option><option value="noisy">有人/嘈杂</option><option value="class">必须听课</option></select></label></div><label><input type="checkbox" id="computer"> 需要电脑</label><label>任务描述<textarea id="desc" rows="3"></textarea></label><button class="primary">保存任务</button></form></div></div><footer>把零碎时间，还给自己。 <span><button id="export">导出数据</button><button id="import">导入数据</button></span></footer><input type="file" id="file" hidden accept="application/json"><script src="app.js"></script></body></html>
