<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>随时开始 · 产品概念预览</title>
<link rel="stylesheet" href="../../../style.css">
<style>
body{background:#eeede6}.proposal{max-width:1600px;margin:auto;padding:38px 44px 34px}.proposal-heading{display:flex;align-items:end;justify-content:space-between;gap:32px;margin-bottom:26px}.proposal-heading .eyebrow{font-size:11px;letter-spacing:.17em;color:var(--p);margin:0 0 9px}.proposal-heading h1{font-size:34px;line-height:1.4;margin:0}.proposal-heading>p{font-size:12px;color:var(--m);margin:0 0 5px}.states{display:grid;grid-template-columns:1fr 1fr;gap:28px}.state-caption{display:flex;align-items:center;gap:11px;font-size:13px;color:var(--m);margin-bottom:14px}.state-caption span{color:var(--p);font-size:11px;letter-spacing:.1em}.app-window{height:820px;border:1px solid var(--l);border-radius:17px;background:var(--bg);overflow:hidden}.app-header{height:78px;border-bottom:1px solid var(--l);display:flex;align-items:center;gap:24px;padding:0 28px}.app-brand{font-size:17px;white-space:nowrap;margin-right:auto}.app-nav{display:flex;align-items:center;gap:23px;color:var(--m);font-size:13px}.app-nav .active{color:var(--p);position:relative}.app-nav .active:after{position:absolute;bottom:-24px;left:0;right:0;content:'';height:2px;background:var(--p)}.settings-icon{width:18px;height:18px;color:var(--m);margin-left:1px}.start-workspace{max-width:470px;margin:76px auto 0;padding:0 15px}.preview-controls{display:flex;justify-content:center;gap:30px;margin-bottom:28px}.preview-picker{position:relative}.preview-picker>summary{display:flex;align-items:center;justify-content:center;gap:12px;min-height:44px;font-size:14px;color:var(--p)}.picker-options{position:absolute;left:50%;top:47px;transform:translateX(-50%);width:214px;max-width:calc(100vw - 32px);padding:8px;background:var(--s);border:1px solid var(--l);border-radius:10px;z-index:5;box-shadow:0 12px 36px #30372c10}.picker-options button{display:block;width:100%;min-height:38px;text-align:left;font-size:13px;border-radius:6px;padding:7px 12px}.picker-options button:hover,.picker-options button[aria-pressed=true]{background:var(--ps);color:var(--p)}.conditions-options{width:240px;padding:17px}.conditions-options label{display:flex;justify-content:space-between;align-items:center;gap:14px;font-size:12px;min-height:36px}.conditions-options input{min-height:0;padding:0;width:16px;height:16px}.preview-rec{padding:36px 34px 24px;background:var(--s);border:1px solid var(--l);border-radius:21px;text-align:center}.preview-rec h2{font-size:47px;line-height:1.25;margin:7px 0 0;overflow-wrap:anywhere}.next-step{margin:27px 0 30px;padding:14px 17px 16px;border-radius:10px;background:#f0f1e9;text-align:left}.next-step-heading{display:flex;align-items:center;justify-content:space-between;color:var(--m);font-size:11px;margin-bottom:7px}.edit-next{width:25px;height:25px;color:var(--m);padding:3px;display:grid;place-items:center;border-radius:5px}.edit-next:hover{background:var(--ps);color:var(--p)}.edit-next svg{width:14px;height:14px}.next-copy{font-size:15px;margin:0;line-height:1.6;color:var(--t);overflow-wrap:anywhere}.next-edit{margin-top:8px}.next-edit input{width:100%;font-size:13px;padding:8px 10px}.next-edit button{font-size:12px;min-height:34px;color:var(--p);padding:5px 0;margin-top:5px}.preview-start{width:100%;min-height:53px;gap:10px;font-size:17px}.change-activity{display:block;min-height:44px;margin:13px auto 0;padding:7px 12px;font-size:14px;color:var(--p)}.change-activity:hover{text-decoration:underline;text-underline-offset:5px}.timer-workspace{max-width:470px;margin:82px auto 0;padding:0 15px;text-align:center}.timer-kicker{font-size:13px;color:var(--p);margin:0 0 22px}.timer-workspace h2{font-size:43px;line-height:1.3;margin:0 0 14px;overflow-wrap:anywhere}.timer-next{font-size:14px;color:var(--m);margin:0;line-height:1.7;min-height:24px;overflow-wrap:anywhere}.clock-area{margin:47px 0 0}.clock-label{font-size:12px;color:var(--m);margin:0 0 9px}.count-up{font-size:104px;line-height:1.2;font-weight:500;letter-spacing:-.035em;font-variant-numeric:tabular-nums}.timer-mode{font-size:12px;color:var(--m);margin:15px 0 0}.timer-actions-preview{display:flex;justify-content:center;gap:15px;margin-top:46px}.timer-actions-preview button{min-width:139px;min-height:48px;font-size:15px}.completion{margin-top:87px}.completion h2{font-size:29px;margin-bottom:24px}.completion p{font-size:14px;color:var(--m)}.completion .primary{margin-top:29px;min-width:185px}.leave-note{display:block;margin:16px auto 0;font-size:13px;color:var(--p);min-height:40px}.checkpoint-editor{margin:22px auto 0;text-align:left;max-width:330px}.checkpoint-editor label{display:block;font-size:12px;color:var(--m);margin-bottom:8px}.checkpoint-editor input{width:100%;font-size:14px}.checkpoint-editor button{color:var(--p);font-size:13px;min-height:40px;margin-top:8px}.checkpoint-status{font-size:12px;color:var(--m);min-height:20px;margin:8px 0}
@media(max-width:1000px){.states{grid-template-columns:1fr}.proposal{padding:26px 16px}.proposal-heading{display:block}.proposal-heading>p{margin-top:12px}.app-window{height:780px}.app-header{padding:0 20px;gap:15px}.app-nav{gap:18px}.start-workspace{margin-top:66px}.timer-workspace{margin-top:76px}}
@media(max-width:420px){.proposal-heading h1{font-size:27px}.app-header{padding:0 12px;gap:8px;height:70px}.app-brand{font-size:14px}.app-nav{font-size:10px;gap:12px}.settings-icon{width:15px;height:15px}.app-nav .active:after{bottom:-25px}.preview-rec{padding:30px 22px 20px}.preview-rec h2{font-size:37px}.preview-controls{gap:22px}.preview-picker>summary{font-size:12px}.timer-workspace h2{font-size:36px}.count-up{font-size:86px}.timer-actions-preview button{min-width:115px}.next-copy{font-size:13px}.timer-next{font-size:12px}}
</style>
</head>
<body>
<div class="proposal">
 <div class="proposal-heading"><div><p class="eyebrow">NOW WHAT / PRODUCT CONCEPT</p><h1>随时开始，下次接着做</h1></div><p>不设时长 ＋ 下一步续接 · 产品预览 · 示例内容</p></div>
 <div class="states">
  <section><div class="state-caption"><span>01</span>首页 · 看见下一步，直接开始</div><div class="app-window">
   <div class="app-header"><span class="app-brand">现在做什么</span><div class="app-nav"><span class="active">开始</span><span>我的活动</span><span>今天</span></div><svg class="settings-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m9 3-.6 2.2-2 .9-2.1-.6-2 3.5 1.6 1.6v2.3L2.3 14l2 3.5 2.1-.6 2 .9L9 20h4l.6-2.2 2-.9 2.1.6 2-3.5-1.6-1.6v-2.3L19.7 9l-2-3.5-2.1.6-2-.9L13 3Z"/><circle cx="11" cy="11.5" r="3"/></svg></div>
   <div class="start-workspace">
    <div class="preview-controls">
     <details class="preview-picker" id="timeChoice"><summary><span id="selectedTime">不设时长</span><span class="chevron" aria-hidden="true"></span></summary><div class="picker-options" role="group" aria-label="本次时间"><button type="button" data-minutes="0" aria-pressed="true">不设时长</button><button type="button" data-minutes="5" aria-pressed="false">5 分钟</button><button type="button" data-minutes="10" aria-pressed="false">10 分钟</button><button type="button" data-minutes="15" aria-pressed="false">15 分钟</button><button type="button" data-minutes="30" aria-pressed="false">30 分钟</button><button type="button" data-minutes="60" aria-pressed="false">60 分钟</button></div></details>
     <details class="preview-picker" id="conditionsChoice"><summary>当前条件<span class="chevron" aria-hidden="true"></span></summary><div class="picker-options conditions-options"><label>方便使用电脑<input type="checkbox" checked></label><label>方便听音频<input type="checkbox"></label><label>方便出声<input type="checkbox"></label><label>可能随时被打断<input type="checkbox"></label></div></details>
    </div>
    <div class="preview-rec"><h2 id="activityName">Vibe Coding</h2>
     <div class="next-step"><div class="next-step-heading"><span>下一步</span><button type="button" class="edit-next" id="editStep" aria-label="修改下一步"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m15.5 4.5 4 4M4 20l4.5-1L20 7.5a2.8 2.8 0 0 0-4-4L4.5 15Z"/></svg></button></div><p class="next-copy" id="stepCopy">接着调整首页按钮间距</p><form class="next-edit" id="stepEditor" hidden><label class="sr-only" for="stepInput">下一步，可不填</label><input id="stepInput" maxlength="200" placeholder="下次从哪里继续？（可不填）"><button type="submit">保存</button></form></div>
     <button type="button" class="primary preview-start" id="begin"><span class="play-icon" aria-hidden="true"></span>开始</button><button type="button" class="change-activity" id="change">换一件</button>
    </div>
   </div>
  </div></section>
  <section><div class="state-caption"><span>02</span>开始后 · 只记录已经投入的时间</div><div class="app-window">
   <div class="app-header"><span class="app-brand">现在做什么</span><div class="app-nav"><span class="active">开始</span><span>我的活动</span><span>今天</span></div><svg class="settings-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m9 3-.6 2.2-2 .9-2.1-.6-2 3.5 1.6 1.6v2.3L2.3 14l2 3.5 2.1-.6 2 .9L9 20h4l.6-2.2 2-.9 2.1.6 2-3.5-1.6-1.6v-2.3L19.7 9l-2-3.5-2.1.6-2-.9L13 3Z"/><circle cx="11" cy="11.5" r="3"/></svg></div>
   <div class="timer-workspace">
    <div id="runningView"><p class="timer-kicker" id="runningStatus">正在进行</p><h2 id="runningName">Vibe Coding</h2><p class="timer-next" id="runningStep">接着调整首页按钮间距</p><div class="clock-area"><p class="clock-label" id="clockLabel">已进行</p><div class="count-up" id="clock">08:32</div><p class="timer-mode" id="timerMode">不设时长</p></div><div class="timer-actions-preview"><button type="button" class="secondary" id="pause">暂停</button><button type="button" class="primary" id="end">结束</button></div></div>
    <div class="completion" id="finishedView" hidden><h2 id="savedTime">已记录 8 分钟 32 秒</h2><button type="button" class="leave-note" id="leaveNote">留一句下次做什么</button><form class="checkpoint-editor" id="checkpointEditor" hidden><label for="checkpointInput">下一步（可不填）</label><input id="checkpointInput" maxlength="200" placeholder="下次从这里继续"><button type="submit">保存</button></form><p class="checkpoint-status" id="checkpointStatus"></p><button type="button" class="primary" id="back">返回开始</button></div>
   </div>
  </div></section>
 </div>
</div>
<script>
// Standalone concept: example activities and preview state live only in memory.
const capture=new URLSearchParams(location.search).has('capture');
const samples=[{name:'Vibe Coding',step:'接着调整首页按钮间距'},{name:'读书',step:'从第 42 页继续'},{name:'练吉他',step:''}];
let selected=0,active=0,minutes=0,activeMinutes=0,elapsed=512,paused=false,ended=false,lastTick=performance.now();
const el=id=>document.getElementById(id),clock=seconds=>String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');
function showRecommendation(){const item=samples[selected];el('activityName').textContent=item.name;el('stepCopy').textContent=item.step;document.querySelector('.next-step').hidden=!item.step;el('stepEditor').hidden=true;el('stepCopy').hidden=false}
function renderTimer(){const remaining=activeMinutes*60-elapsed;el('runningName').textContent=samples[active].name;el('runningStep').textContent=samples[active].step;el('runningStatus').textContent=paused?'已暂停':'正在进行';el('pause').textContent=paused?'继续':'暂停';el('clockLabel').textContent=activeMinutes&&remaining>0?'剩余时间':'已进行';el('clock').textContent=clock(activeMinutes&&remaining>0?remaining:elapsed);el('timerMode').textContent=activeMinutes?'本次 '+activeMinutes+' 分钟':'不设时长'}
el('begin').onclick=()=>{active=selected;activeMinutes=minutes;elapsed=0;paused=false;ended=false;lastTick=performance.now();el('runningView').hidden=false;el('finishedView').hidden=true;renderTimer()};
el('change').onclick=()=>{selected=(selected+1)%samples.length;showRecommendation()};
document.querySelectorAll('[data-minutes]').forEach(b=>b.onclick=()=>{minutes=Number(b.dataset.minutes);el('selectedTime').textContent=minutes?minutes+' 分钟':'不设时长';document.querySelectorAll('[data-minutes]').forEach(option=>option.setAttribute('aria-pressed',String(option===b)));el('timeChoice').open=false});
el('editStep').onclick=()=>{el('stepInput').value=samples[selected].step;el('stepCopy').hidden=true;el('stepEditor').hidden=false;el('stepInput').focus()};
el('stepEditor').onsubmit=event=>{event.preventDefault();samples[selected].step=el('stepInput').value.trim();showRecommendation()};
el('pause').onclick=()=>{paused=!paused;lastTick=performance.now();renderTimer()};
el('end').onclick=()=>{ended=true;el('runningView').hidden=true;el('finishedView').hidden=false;const m=Math.floor(elapsed/60),s=elapsed%60;el('savedTime').textContent='已记录 '+(m?m+' 分钟 ':'')+s+' 秒';el('checkpointEditor').hidden=true;el('checkpointStatus').textContent=''};
el('leaveNote').onclick=()=>{el('checkpointInput').value=samples[active].step;el('checkpointEditor').hidden=false;el('checkpointInput').focus()};
el('checkpointEditor').onsubmit=event=>{event.preventDefault();samples[active].step=el('checkpointInput').value.trim();el('checkpointEditor').hidden=true;el('checkpointStatus').textContent='已留好，下次接着做';if(selected===active)showRecommendation()};
el('back').onclick=()=>{selected=active;showRecommendation();el('begin').focus()};
document.addEventListener('click',event=>document.querySelectorAll('.preview-picker[open]').forEach(picker=>{if(!picker.contains(event.target))picker.open=false}));
if(!capture)setInterval(()=>{if(paused||ended)return;const now=performance.now(),seconds=Math.floor((now-lastTick)/1000);if(seconds){elapsed+=seconds;lastTick+=seconds*1000;renderTimer()}},200);
</script>
</body>
</html>
