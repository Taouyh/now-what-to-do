<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Now What · 推荐页概念预览</title>
<style>
:root{color-scheme:light;--bg:#f7f5f0;--paper:#fdfcf9;--ink:#2e302b;--muted:#74786c;--line:#dedfd5;--olive:#5b6650;--soft:#edf0e6}
*{box-sizing:border-box}body{margin:0;background:#eeeee7;color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;font-size:14px;line-height:1.6}button,input{font:inherit;color:inherit}button{border:0;cursor:pointer;background:none}button:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--olive);outline-offset:4px}button:hover{color:var(--olive)}svg{display:block;flex-shrink:0}button,summary{-webkit-tap-highlight-color:transparent}.board{max-width:1600px;margin:auto;padding:40px 44px 30px}.board-heading{display:flex;justify-content:space-between;align-items:end;margin-bottom:29px}.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--olive);margin:0 0 10px}.board-heading h1{font-size:30px;line-height:1.4;margin:0;font-weight:600;letter-spacing:.02em}.board-heading>p{font-size:12px;color:var(--muted);margin:0 0 5px}.states{display:grid;grid-template-columns:1fr 1fr;gap:30px}.caption{display:flex;align-items:center;gap:11px;margin-bottom:13px;font-size:13px;color:#5c6357}.caption span{font-size:11px;color:var(--olive);letter-spacing:.1em}.window{height:716px;background:var(--bg);border:1px solid #d6d8cd;border-radius:15px;overflow:hidden;box-shadow:0 8px 24px #353d2810}.app-header{height:80px;padding:0 29px;display:flex;gap:25px;align-items:center;border-bottom:1px solid #e6e6dc}.brand{font-size:18px;letter-spacing:-.04em;margin-right:auto;font-weight:500}.nav{display:flex;align-items:center;gap:22px;color:var(--muted);font-size:12px}.nav .active{position:relative;color:var(--olive)}.nav .active:after{content:"";position:absolute;left:0;right:0;bottom:-12px;height:2px;background:var(--olive)}.gear{width:19px;height:19px;color:var(--muted)}.workspace{max-width:464px;margin:77px auto 0;padding:0 12px}.controls{display:flex;justify-content:center;gap:26px;margin-bottom:24px;color:var(--muted)}.picker{position:relative}.picker summary{list-style:none;cursor:pointer;min-height:40px;display:flex;gap:12px;align-items:center;padding:5px;font-size:14px}.picker summary::-webkit-details-marker{display:none}.chevron{width:7px;height:7px;border-right:1px solid;border-bottom:1px solid;transform:rotate(45deg);margin-top:-4px}.picker[open] .chevron{transform:rotate(225deg);margin-top:4px}.picker-panel{position:absolute;left:50%;top:44px;transform:translateX(-50%);z-index:8;background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:12px;width:235px;box-shadow:0 7px 20px #30352a0d}.times{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;width:292px}.times button{border:1px solid var(--line);border-radius:7px;padding:8px 4px;font-size:12px;min-height:38px}.times button.selected{background:var(--soft);border-color:var(--olive)}.picker-panel label{display:flex;justify-content:space-between;align-items:center;min-height:40px;font-size:12px;padding:0 6px}.picker-panel input{width:16px;height:16px;accent-color:var(--olive)}.card{position:relative;text-align:center;background:var(--paper);border:1px solid var(--line);border-radius:21px;padding:37px 36px 23px;min-height:362px}.card h2{font-size:47px;font-weight:600;line-height:1.3;margin:8px 0 28px;font-family:"Songti SC","STSong","SimSun",serif;overflow-wrap:anywhere}.more{position:absolute;top:15px;right:18px;width:34px;height:34px;font-size:22px;letter-spacing:2px;color:#838879;line-height:1;border-radius:7px;display:grid;place-items:center;padding:0 0 10px 2px}.more:hover,.more[aria-expanded=true]{background:#eeefe7;color:var(--olive)}.step{margin:0 0 31px;text-align:center}.step-label{font-size:11px;color:#8a8f80;margin-bottom:8px}.step-copy{font-size:14px;line-height:1.8;margin:0;color:#5f6658;min-height:26px}.start{background:var(--olive);color:#fffef8;display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px;width:100%;max-width:300px;border-radius:10px;font-size:17px;margin:0 auto}.start:hover{background:#505c46;color:#fffef8}.play{width:0;height:0;border-top:6px solid transparent;border-bottom:6px solid transparent;border-left:9px solid currentColor}.change{display:block;color:var(--olive);font-size:14px;min-height:44px;margin:11px auto 0;padding:7px 14px}.change:hover,.choose:hover{text-decoration:underline;text-underline-offset:4px}.choose{display:block;color:var(--muted);font-size:12px;min-height:42px;margin:19px auto 0;padding:8px 12px}.menu{position:absolute;z-index:7;right:16px;top:56px;width:219px;background:var(--paper);border:1px solid #d9ddcf;border-radius:10px;box-shadow:0 10px 28px #30372914;padding:7px}.menu button{display:flex;align-items:center;gap:11px;min-height:46px;width:100%;text-align:left;padding:9px 11px;font-size:12px;border-radius:6px}.menu button:hover{background:var(--soft)}.menu svg{width:15px;height:15px;color:var(--olive)}.menu button+button{border-top:1px solid #e8e9df;border-top-left-radius:0;border-top-right-radius:0}.step-editor{margin:0 0 25px;text-align:left}.step-editor input{width:100%;padding:9px 11px;border:1px solid var(--line);background:var(--bg);border-radius:7px;font-size:13px}.step-editor button{font-size:12px;min-height:32px;color:var(--olive);padding:5px 0}.empty{padding-top:15px}.empty h2{font-size:28px;margin:17px 0}.empty p{font-size:13px;line-height:1.9;color:var(--muted);margin:0 0 29px}.empty .secondary{border:1px solid var(--line);color:var(--olive);min-height:44px;padding:8px 24px;border-radius:9px}.activity-choice{padding:0;margin:10px 0;list-style:none;text-align:left}.activity-choice button{width:100%;border-top:1px solid var(--line);padding:12px 4px;text-align:left;font-size:14px}.toast{margin:12px 0 0;padding:10px;border:1px solid var(--line);border-radius:9px;background:#f0f2e9;font-size:12px;color:var(--olive);text-align:center}.note{margin:17px 5px 0;font-size:12px;color:#707868;line-height:1.8}.note strong{color:#495441;font-weight:500}.board-footer{display:flex;justify-content:space-between;align-items:center;margin-top:29px;border-top:1px solid #dadcd0;padding-top:15px;color:#818676;font-size:11px}.board-footer button{font-size:11px;color:#6b755d;padding:5px 0}[hidden]{display:none!important}
@media(min-width:1450px){[data-demo="1"] .menu{right:-126px;width:205px}}
@media(max-width:1050px){.states{grid-template-columns:1fr}.board{padding:27px 17px}.board-heading{display:block}.board-heading>p{margin-top:12px}.window{height:690px}.workspace{margin-top:65px}.note{margin-bottom:18px}}
@media(max-width:450px){.app-header{height:72px;padding:0 15px;gap:16px}.brand{font-size:16px}.nav{gap:12px;font-size:10px}.gear{width:16px;height:16px}.workspace{margin-top:65px;padding:0 18px}.card{padding:36px 24px 22px}.card h2{font-size:38px}.step-copy{font-size:12px}.board-heading h1{font-size:25px}.menu{right:11px;width:205px}.window{height:650px}.board-footer{gap:20px;align-items:start}}

.more-area{position:absolute;right:18px;top:15px;width:38px;height:38px;z-index:7}
.more-area .more{position:relative;top:0;right:0;width:38px;height:38px}
.more-area .menu{right:0;top:45px}
.step-editor{margin:0;text-align:left}
.step-editor label{display:block;font-size:12px;color:#626b59;margin-bottom:10px}
.step-editor label span{color:#929887;font-size:11px}
.step-editor input{min-height:48px;padding:11px 13px;background:#f7f6f1;font-size:14px}
.editor-actions{display:flex;justify-content:flex-end;align-items:center;gap:12px;margin-top:14px}
.step-editor .save-step{display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:126px;padding:9px 18px;border-radius:8px;background:var(--olive);color:#fffef8;font-weight:500;font-size:13px}
.step-editor .save-step:hover{background:#505c46;color:#fffef8}
.step-editor .cancel-step{min-height:44px;padding:9px 16px;color:var(--muted);font-size:13px}
.step-editor .cancel-step:hover{background:#eeefe7;border-radius:8px;color:var(--olive)}
.card.editing{min-height:362px}
.card.editing h2{margin-bottom:32px}
@media(min-width:1450px){[data-demo="1"] .more-area .menu{right:-144px;width:205px}}
@media(max-width:450px){.more-area{right:14px}.more-area .menu{width:205px}.step-editor input{font-size:13px}.editor-actions{gap:8px}.step-editor .save-step{min-width:116px}}
</style>
</head>
<body>
<main class="board">
 <div class="board-heading"><div><p class="eyebrow">NOW WHAT / PRODUCT CONCEPT</p><h1>推荐页 · 保存与悬停交互</h1></div><p>沿用现有风格 · 示例内容</p></div>
 <div class="states">
  <section><div class="caption"><span>01</span>修改下一步，保存一眼可见</div><div class="window" data-demo="0"></div><p class="note"><strong>保存放在输入框右下方。</strong> 使用明显的主按钮，旁边可以取消。</p></section>
  <section><div class="caption"><span>02</span>移到三个点，选项自动展开</div><div class="window" data-demo="1"></div><p class="note"><strong>悬停展开，移出关闭。</strong> 时间、当前条件也使用相同交互；手机保留点按。</p></section>
 </div>
 <div class="board-footer"><span>概念预览 · 可编辑、保存，也可悬停体验菜单</span><button type="button" id="reset">重置演示 ↺</button></div>
</main>
<script src="preview.js"></script>
</body>
</html>
